services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mangaid-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_VISION=${GEMINI_MODEL_VISION:-gemini-2.5-flash}
      - GEMINI_MODEL_TEXT=${GEMINI_MODEL_TEXT:-gemini-2.5-flash}
      - GEMINI_MODEL_IMAGE=${GEMINI_MODEL_IMAGE:-gemini-2.5-flash}
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/mangaid.db
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mangaid-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
